name: Docker Image

on:
  push:
    branches:
      - main
      - v1.0.3
  pull_request:
    paths:
      - ".dockerignore"
      - "Dockerfile"
      - "docker/**"
      - "apps/web-room/**"
      - "packages/**"
      - "server/**"
      - "services/media-extractor-service/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docker-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: benxl/syncroom-server

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tags
        id: image
        shell: bash
        run: |
          set -euo pipefail

          tags=()
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            tags+=("${IMAGE_NAME}:pr-${{ github.event.pull_request.number }}")
          elif [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="${GITHUB_REF_NAME#v}"
            tags+=("${IMAGE_NAME}:${version}")
            tags+=("${IMAGE_NAME}:${GITHUB_REF_NAME}")
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            short_sha="${GITHUB_SHA::12}"
            tags+=("${IMAGE_NAME}:main")
            tags+=("${IMAGE_NAME}:main-${short_sha}")
            tags+=("${IMAGE_NAME}:latest")
          else
            safe_ref="$(printf '%s' "${GITHUB_REF_NAME}" | tr '/:@' '---')"
            tags+=("${IMAGE_NAME}:${safe_ref}")
          fi

          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check Docker Hub token
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "::error::Set the DOCKERHUB_TOKEN repository secret before publishing Docker images."
            exit 1
          fi

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.4.0
        with:
          username: benxl
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tags }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
